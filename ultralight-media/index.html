<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UltraLight Media</title>
  <meta name="description" content="Hafif, yerel ve çevrimdışı çalışabilen müzik çalar.">
  <meta name="theme-color" content="#0b0d12">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <header class="top">
    <h1>UltraLight</h1>
    <button id="theme" class="icon-btn" type="button" aria-label="Açık/koyu tema" aria-pressed="false">◐</button>
  </header>
  <main>
    <section class="player" aria-label="Oynatıcı">
      <canvas id="viz" aria-hidden="true"></canvas>
      <h2 id="title">Bir parça seç</h2>
      <div class="seekrow">
        <span id="cur">0:00</span>
        <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Konum">
        <span id="total">0:00</span>
      </div>
      <div class="controls">
        <button id="shuffle" class="icon-btn" type="button" aria-label="Karıştır" aria-pressed="false">🔀</button>
        <button id="prev" class="icon-btn" type="button" aria-label="Önceki">⏮</button>
        <button id="play" class="play" type="button" aria-label="Oynat">▶</button>
        <button id="next" class="icon-btn" type="button" aria-label="Sonraki">⏭</button>
        <button id="repeat" class="icon-btn" type="button" aria-label="Tekrar: kapalı" aria-pressed="false">🔁</button>
      </div>
      <label class="volrow">Ses <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <fieldset class="eq"><legend>Ekolayzer (Hz, çift tıkla sıfırla)</legend><div id="eq"></div></fieldset>
    </section>
    <section class="library" aria-label="Kütüphane">
      <div class="tools">
        <input id="search" type="search" placeholder="Kütüphanede ara" aria-label="Kütüphanede ara">
        <button id="favOnly" class="chip" type="button" aria-pressed="false">★ Favoriler</button>
        <button id="add" class="chip primary" type="button">Dosya ekle</button>
        <input id="file" type="file" accept="audio/*" multiple hidden>
      </div>
      <p id="empty" class="empty"></p>
      <ul id="list"></ul>
    </section>
  </main>
  <div id="drop" aria-hidden="true">Ses dosyalarını bırak</div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>UltraLight Media için JavaScript gerekli.</noscript>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
